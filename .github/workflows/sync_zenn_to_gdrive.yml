# .github/workflows/sync_zenn_to_gdrive.yml
name: Sync Zenn Articles and Books to Google Drive

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
      - 'books/**'

# WIFでの認証トークン取得に必要なパーミッション設定
permissions:
  contents: read
  id-token: write

jobs:
  sync:
    name: Combine and Sync Knowledge Base
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 記事と本の結合（XMLタグでカプセル化）
      - name: Combine Articles and Books with XML Tags
        run: |
          OUTPUT_FILE="combined_knowledge.md"
          
          # 最上部にシステム説明（取扱説明書）を注入
          cat << 'EOF' > $OUTPUT_FILE
          <system_instruction>
          このドキュメントは、著者がGitリポジトリで管理している技術記事および本のコンテンツを一つに集約したナレッジベースです。
          データの境界線を明確にするため、独自のカスタムXML風タグを使用して構造化されています。
          AIがこのファイルを解析・検索する際は、以下の構造ルールを正しく理解し、尊重してください。

          - <article path="..."> : 単一の独立した技術記事（ブログ投稿）を示します。path属性はリポジトリ内のファイル位置です。
          - <book slug="..."> : 複数のチャプターで構成される技術書（本）の全体構造を示します。
          - <chapter path="..."> : 親となる本に属する、個別のチャプター（章）の内容を示します。

          ※注意：これらのタグの内部に含まれるMarkdownの見出し記法（#, ##, ### など）は、すべて元の記事本文のデザイン（見出し）であり、
          ※      ドキュメント全体のグローバルな階層構造を表すものではありません。
          ※      記事や本の境界線はMarkdownの見出しではなく、必ず上記のXML風タグ（<article>, <chapter>など）を基準に判定してください。
          </system_instruction>
          
          EOF
          
          # 記事（articles）の結合
          if [ -d "articles" ]; then
            for file in articles/*.md; do
              if [ -f "$file" ]; then
                echo "<article path=\"$file\">" >> $OUTPUT_FILE
                cat "$file" >> $OUTPUT_FILE
                echo -e "\n</article>\n" >> $OUTPUT_FILE
              fi
            done
          fi

          # 本（books）の結合
          if [ -d "books" ]; then
            for book_dir in books/*; do
              if [ -d "$book_dir" ]; then
                book_slug=$(basename "$book_dir")
                echo "<book slug=\"$book_slug\">" >> $OUTPUT_FILE
                
                for chapter_file in "$book_dir"/*.md; do
                  if [ -f "$chapter_file" ]; then
                    echo "  <chapter path=\"$chapter_file\">" >> $OUTPUT_FILE
                    cat "$chapter_file" >> $OUTPUT_FILE
                    echo -e "\n  </chapter>" >> $OUTPUT_FILE
                  fi
                done
                
                echo -e "</book>\n" >> $OUTPUT_FILE
              fi
            done
          fi

      # 2. Workload Identity Federation による一時トークンの発行
      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_scopes: 'https://www.googleapis.com/auth/drive'

      # 3. GitHub Releases の latest からダウンロードURLを動的に抽出してインストール
      - name: Setup gdrive CLI (Always Latest Version)
        run: |
          echo "=== GitHub Releases から最新のダウンロードURLを取得中 ==="
          
          # GitHub APIから、最新リリースの「gdrive_linux-x64.tar.gz」に一致する直リンクURLを動的に抽出
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/glotlabs/gdrive/releases/latest \
            | jq -r '.assets[] | select(.name == "gdrive_linux-x64.tar.gz") | .browser_download_url')
          
          echo "最新のダウンロードURL [ ${DOWNLOAD_URL} ] を取得しました。"
          
          # 抽出したURLから直接ダウンロードして展開
          curl -sL "$DOWNLOAD_URL" | tar xz
          sudo mv gdrive /usr/local/bin/
          
          echo "gdrive CLI のインストールが完了しました："
          gdrive version

      # 4. 指定されたファイル構造を動的に生成し、上書き同期（Update）を実行
      - name: Sync to Google Drive (Always Update)
        run: |
          # 1. 設定ファイル用のディレクトリを作成
          mkdir -p ~/.config/gdrive3/WIF
          
          # 2. account.json の生成 (アクティブアカウントを WIF に固定)
          cat << 'EOF' > ~/.config/gdrive3/account.json
          {
            "current": "WIF"
          }
          EOF
          
          # 3. secret.json の生成 (ダミーデータ)
          cat << 'EOF' > ~/.config/gdrive3/WIF/secret.json
          {
            "client_id": "",
            "client_secret": ""
          }
          EOF
          
          # 4. tokens.json の生成 (access_token 以外はダミーデータ)
          cat << EOF > ~/.config/gdrive3/WIF/tokens.json
          [
            {
              "scopes": [
                "https://www.googleapis.com/auth/drive"
              ],
              "token": {
                "access_token": "${{ steps.auth.outputs.access_token }}",
                "refresh_token": "",
                "expires_at": [3000, 1, 1, 1, 0, 0, 0, 0, 0],
                "id_token": null
              }
            }
          ]
          EOF
          
          echo "=== 認証用の設定ファイル(JSON)生成が完了しました ==="
          echo "=== 現在アクティブな gdrive アカウントの確認 ==="
          gdrive account current
          
          echo "=== Google Drive への上書き（Update）を実行します ==="
          
          # 5. 現在のアカウント（WIF）で冪等性を担保した上書きを実行
          gdrive files update \
            --mime "application/vnd.google-apps.document" \
            "${{ secrets.GOOGLE_DRIVE_FILE_ID }}" combined_knowledge.md